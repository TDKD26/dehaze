[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-day-night-dehaze"
version = "0.1.0"
description = "Confidence-routed day/night dehazing mixture of experts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "torch>=2.1", "torchvision>=0.16"]

[tool.setuptools.packages.find]
include = ["unified_dehaze*"]

